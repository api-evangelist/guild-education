aid: guild-education
name: Guild Education
description: >-
  Guild is an education benefits platform that helps large employers turn workforce education into
  workforce strategy. Guild connects a company's frontline and hourly workers to a curated marketplace
  of debt-free education, upskilling, and career-development programs delivered through vetted learning
  partners (universities, bootcamps, and skilling providers), and pairs that access with coaching and
  analytics so HR leaders can fill critical roles, improve retention, increase internal mobility, and
  prove measurable ROI. Guild operates as a B2B2C platform: employers fund and administer the benefit,
  learning partners supply the programs, and members (employees) enroll and progress toward degrees,
  certificates, and new durable skills. Guild does not publish a public developer API, SDKs, or
  developer portal; this profile captures its public company and web-property surface.
